<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pace">
<meta name="theme-color" content="#000000">
<title>Pace</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="l">Current pace /km</div><div class="big" id="cur">--:--</div>
<div class="l">Average pace /km</div><div class="mid" id="avg">--:--</div>
<div class="row">
  <div><div class="l">Time</div><div class="mid" id="tm">0:00</div></div>
  <div><div class="l">Km</div><div class="mid" id="km">0.00</div></div>
</div>
<div class="row"><button id="go">Start</button><button id="rs">Reset</button></div>
<div id="gps">GPS: off</div>
<div id="sp"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
